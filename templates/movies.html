{% extends "base.html" %}

{% block content %}

<h1>Movies</h1>

<ul>
    {% for movie in movies %}
    <li>
        {{ movie.name }}

        <form
            action="{{ url_for('update_movie', user_id=movie.user_id, movie_id=movie.id) }}"
            method="post"
        >
            <input type="text" name="title" value="{{ movie.name }}" required>
            <button type="submit">Update</button>
        </form>

        <form
            action="{{ url_for('delete_movie', user_id=movie.user_id, movie_id=movie.id) }}"
            method="post"
        >
            <button type="submit">Delete</button>
        </form>
    </li>
    {% endfor %}
</ul>

<h2>Add a Movie</h2>

<form action="{{ url_for('add_movie', user_id=user_id) }}" method="post">
    <label for="title">Movie title:</label>
    <input type="text" id="title" name="title" required>
    <button type="submit">Add Movie</button>
</form>

{% endblock %}
